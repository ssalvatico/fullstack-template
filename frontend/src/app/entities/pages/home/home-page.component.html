<div>
  @if (!formOpen()) {
    <app-entities-render-entity
      [entityName]="selectedEntity()"
      [items]="items()"
      [relationLabels]="relationLabels()"
      (create)="openCreate()"
      (edit)="openEdit($event)"
      (remove)="onDelete($event)"
    ></app-entities-render-entity>
  } @else {
    <app-entity-form
      [fields]="fields()"
      [initial]="editingRow()"
      [relationOptions]="relationOptions()"
      (save)="onSave($event)"
      (cancel)="closeForm()"
    ></app-entity-form>
  }
</div>
